name: Release & Publish

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      force_publish:
        description: 'Force publish even if no new version is detected'
        required: false
        type: boolean
        default: false

# Run releases one at a time. Each run pushes a version commit to main, so
# overlapping runs would reject each other's pushes. Queued runs check out the
# latest main when they start.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  run-tests:
    name: Run Tests
    uses: ./.github/workflows/test.yml
    with:
      python-versions: '["3.11", "3.12", "3.13", "3.14"]'
    secrets: inherit

  release:
    name: Semantic Release & Publish
    needs: run-tests
    environment: pypi
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:
      # The `main` ruleset requires status checks, which blocks semantic-release
      # from pushing its version commit with GITHUB_TOKEN. The release GitHub App
      # is on the ruleset bypass list, so its token can push.
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: 3.12

      - name: Install Poetry
        run: uv tool install poetry

      # Attribute the release commit and tag to the release App's bot account.
      - name: Configure Git User
        id: git-user
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          name="${APP_SLUG}[bot]"
          user_id=$(gh api "/users/${name}" --jq .id)
          email="${user_id}+${name}@users.noreply.github.com"
          git config user.name "$name"
          git config user.email "$email"
          echo "author=${name} <${email}>" >> "$GITHUB_OUTPUT"

      # Bumps the version, updates CHANGELOG.md, then commits, tags and pushes
      # to main and creates the GitHub release.
      - name: Version and Changelog
        id: semantic
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_COMMIT_AUTHOR: ${{ steps.git-user.outputs.author }}
        run: |
          uvx --from "python-semantic-release~=10.7" semantic-release version

          # Check if a new tag was created
          if git describe --tags --exact-match HEAD >/dev/null 2>&1; then
            echo "released=true" >> $GITHUB_OUTPUT
          else
            echo "released=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Package
        run: poetry build

      - name: Upload build to GitHub release
        if: steps.semantic.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          uvx --from "python-semantic-release~=10.7" semantic-release publish

      - name: Publish to TestPyPI
        if: steps.semantic.outputs.released == 'true' || github.event.inputs.force_publish == 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: false
          skip-existing: true

      - name: Publish to PyPI
        if: steps.semantic.outputs.released == 'true' || github.event.inputs.force_publish == 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          repository-url: https://upload.pypi.org/legacy/
          skip-existing: true
          verbose: true
