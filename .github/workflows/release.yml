name: Release & Publish

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      force_publish:
        description: 'Force publish even if no new version is detected'
        required: false
        type: boolean
        default: false

jobs:
  run-tests:
    name: Run Tests
    uses: ./.github/workflows/test.yml
    with:
      python-versions: '["3.10", "3.11", "3.12"]'
    secrets: inherit

  release:
    name: Semantic Release & Publish
    needs: run-tests
    environment: pypi
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:
      # The `main` ruleset requires status checks, which blocks semantic-release
      # from pushing its version commit with GITHUB_TOKEN. The release GitHub App
      # is on the ruleset bypass list, so its token can push.
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: 3.12

      - name: Install Poetry
        run: uv tool install poetry

      - name: Configure Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Bumps the version, updates CHANGELOG.md, then commits, tags and pushes
      # to main and creates the GitHub release.
      - name: Version and Changelog
        id: semantic
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          uvx --from "python-semantic-release~=10.7" semantic-release version

          # Check if a new tag was created
          if git describe --tags --exact-match HEAD >/dev/null 2>&1; then
            echo "released=true" >> $GITHUB_OUTPUT
          else
            echo "released=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Package
        run: poetry build

      - name: Upload build to GitHub release
        if: steps.semantic.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          uvx --from "python-semantic-release~=10.7" semantic-release publish

      - name: Publish to TestPyPI
        if: steps.semantic.outputs.released == 'true' || github.event.inputs.force_publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: false
          skip-existing: true

      - name: Publish to PyPI
        # Only publish if this isn't a pre-release (alpha/beta)
        if:
          (steps.semantic.outputs.released == 'true' || github.event.inputs.force_publish == 'true') &&
          !contains(github.ref, 'alpha') &&
          !contains(github.ref, 'beta') &&
          !contains(github.ref, 'rc')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://upload.pypi.org/legacy/
          skip-existing: true
          verbose: true
